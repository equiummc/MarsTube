name: MarsTube – eine dauerhafte Android TV App

on:
  push:
    branches:
      - mars/production-2
    paths:
      - 'mt2-player-lab/**'
      - 'tools/build-marstube-production.sh'
      - 'tools/production-build-request.txt'
      - '.github/workflows/mt2-production-release.yml'
  workflow_dispatch:

concurrency:
  group: mars-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MarsTube signiert bauen und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Dauerhaft signiertes MarsTube-APK erzeugen
        shell: bash
        run: bash tools/build-marstube-production.sh
      - name: Installierbare APK für den einmaligen Erststart bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MarsTube-production
          path: |
            dist/MarsTube-*.apk
            dist/marstube-tv.json
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Offizielles MarsTube Release für den TV-Updater
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarsTube-production
          path: dist
      - name: Paket und Releaseversion prüfen
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("mt2-player-lab/production-version.json").read_text())
          n=m["versionName"]
          a=Path("dist/MarsTube-"+n+".apk")
          j=json.loads(Path("dist/marstube-tv.json").read_text())
          assert a.is_file() and a.stat().st_size>1000000
          assert j[n]["versionCode"]==m["versionCode"]
          assert j["package"]["downloadSize"]==a.stat().st_size
          assert j["package"]["downloadUrlList"]==[
              "https://github.com/equiummc/MarsTube/releases/download/v"+n+"/"+a.name]
          PY
      - name: Reguläres MarsTube Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v=$(python3 -c 'import json;print(json.load(open("mt2-player-lab/production-version.json"))["versionName"])')
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag existiert schon. Keine Überschreibung."
            exit 1
          fi
          gh release create "$tag" "dist/MarsTube-$v.apk" \
            dist/marstube-tv.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest --title "MarsTube $v" \
            --notes-file dist/release-notes.md
          gh release view "$tag" --json isDraft,isPrerelease,assets \
            --jq '{draft:.isDraft,prerelease:.isPrerelease,assets:[.assets[].name]}' > dist/published.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('mt2-player-lab/production-version.json').read_text())
          a=json.loads(Path('dist/published.json').read_text())
          assert a['draft'] is False and a['prerelease'] is False
          assert {'MarsTube-'+m['versionName']+'.apk','marstube-tv.json','SHA256SUMS'}<=set(a['assets'])
          print('MarsTube stable release bereitgestellt.')
          PY

      - name: Unabhängigen stabilen Versions-Feed nach erfolgreichem Release aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          path = "updates/stable.json"
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          url = "https://api.github.com/repos/" + repo + "/contents/" + path
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MarsTube-Release-Manifest-Sync"
          }
          def send(method, target, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(target, data=body, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          existing = send("GET", url + "?ref=mars/production-2")
          manifest = Path("dist/marstube-tv.json").read_bytes()
          updated = send("PUT", url, {
              "message": "Publish independent MarsTube stable manifest for latest signed release",
              "branch": "mars/production-2",
              "sha": existing["sha"],
              "content": base64.b64encode(manifest).decode("ascii")
          })
          latest = send("GET", url + "?ref=mars/production-2")
          stored = base64.b64decode(latest["content"].replace("\n", ""))
          assert stored == manifest, "Mirror changed unexpectedly after publish"
          print("Trusted raw mirror synced and confirmed; commit", updated["commit"]["sha"])
          PY
