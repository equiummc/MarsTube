name: MT2-034 TV player overlay signed CI

on:
  push:
    branches:
      - feature/mt2-034-player-overlay-20261108
    paths:
      - 'mt2-player-lab/patch_034_player_overlay.py'
      - 'tools/build-marstube-production-034.sh'
      - 'mt2-player-lab/production-version-034.json'
      - 'tools/build-marstube-production-034.sh'
      - '.github/workflows/mt2-034-ci.yml'
  workflow_dispatch:

concurrency:
  group: mt2-034-player-overlay
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed_release_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Compile, run Shorts/SABR tests and sign 0.0.34 with original key
        run: |
          set -euo pipefail
          python3 -m py_compile mt2-player-lab/patch_034_player_overlay.py
          bash tools/build-marstube-production-034.sh
      - name: Check package identity, version, original signing and file size
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/MarsTube-0.0.34.apk
          grep -Fq "name='de.equiummc.marstube2'" dist/badging.txt
          grep -Fq "versionCode='12034'" dist/badging.txt
          grep -Fq "versionName='0.0.34'" dist/badging.txt
          grep -Fq 'certificate SHA-256 digest:' dist/signature.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path("dist/MarsTube-0.0.34.apk")
          with zipfile.ZipFile(apk) as z:
              libs = [(i.filename,i.compress_size) for i in z.infolist() if i.filename.startswith("lib/")]
              assert any("/armeabi-v7a/" in n for n,_ in libs), "Missing ARM32"
              assert any("/arm64-v8a/" in n for n,_ in libs), "Missing ARM64"
              print("SIGNED APK size MiB:",round(apk.stat().st_size/1024/1024,2))
              print("Native libs MiB:",round(sum(size for _,size in libs)/1024/1024,2))
          PY
      - name: Keep test-only signed package for traceability (never publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: MarsTube-0.0.34-ci-only
          path: |
            dist/MarsTube-0.0.34.apk
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
