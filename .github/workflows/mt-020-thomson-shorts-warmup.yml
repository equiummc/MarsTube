name: MT-020 Thomson three-ahead Shorts and single SABR candidate
on:
  push:
    branches:
      - feature/mt-020-thomson-three-ahead-single-sample-20261101
  pull_request:
    branches:
      - fix/mt-019-shorts-blackframe-recovery-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical MarsTube identity and submodules
        run: |
          python3 scripts/mars/verify_fork.py --require-submodules
          grep -Fq 'android:icon="@drawable/mars_brand_tile"' smarttubetv/src/main/AndroidManifest.xml
          grep -Fq 'SHORT_CONTINUATION_TIMEOUT_MS = 6_000L' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
      - name: Check Thomson-only warmup and unchanged Fire route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common')
          loader=(root/'app/models/playback/controllers/VideoLoaderController.java').read_text()
          policy=(root/'app/models/playback/controllers/ShortsDeviceWarmupPolicy.java').read_text()
          prefs=(root/'prefs/PlayerTweaksData.java').read_text()
          overlay=Path('scripts/mars/mt011b3_queue_preloader.py').read_text()
          assert 'isShortWindowTarget()' in loader
          assert 'return isFireShortWindowTarget() || isThomsonShortWindowTarget();' in loader
          assert 'ShortsDeviceWarmupPolicy.shouldPreloadThomsonSample(' in loader
          assert 'maybePreloadThomsonNextShort(distance, target, cached)' in loader
          assert 'maybePreloadThomsonNextShort(distance, target, info)' in loader
          assert 'getPlayer().preloadNextSabrShort(target.videoId, info)' in loader
          assert 'MIN_AVAILABLE_MEMORY_BYTES = 160L * 1024 * 1024' in policy
          assert 'distance == 1 && playing && !loading && !lowMemory' in policy
          assert 'mIsMarsShortMediaPreloadEnabled ||' in prefs
          assert 'allowSecondSampleCandidate(' in overlay
          assert 'hasThomsonSampleHeadroom()' in overlay
          assert 'sample_preload_cancel_memory_pressure=true' in overlay
          assert overlay.count('!isThomsonShortWindowTarget()') >= 3
          assert 'MT-019 black_frame_recovery fresh_retry' in loader
          assert Path('common/src/test/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsDeviceWarmupPolicyTest.java').exists()
          print('MT-020 static safety contracts: PASS')
          PY
      - name: Apply pinned B6 overlays with MT-020 single-candidate guard
        run: |
          python3 scripts/mars/mt008_probe_media_core.py
          python3 scripts/mars/mt009_probe_signature_stages.py --check
          python3 scripts/mars/mt009_probe_signature_stages.py
          python3 scripts/mars/mt010a_decoder_cache.py --check
          python3 scripts/mars/mt010a_decoder_cache.py
          python3 scripts/mars/mt010a2_warm_runtime.py --check
          python3 scripts/mars/mt010a2_warm_runtime.py
          node scripts/mars/mt010a2_validate_solver.js
          python3 scripts/mars/mt011a_tcl_stage_probes.py --check
          python3 scripts/mars/mt011a_tcl_stage_probes.py
          python3 scripts/mars/mt011ab_lowcopy_tcl.py --check
          python3 scripts/mars/mt011ab_lowcopy_tcl.py
          python3 scripts/mars/mt011ab_memory_source_cache.py --check
          python3 scripts/mars/mt011ab_memory_source_cache.py
          node scripts/mars/mt011ab_verify_challenges.js
          python3 scripts/mars/mt011b3_queue_preloader.py --check
          python3 scripts/mars/mt011b3_queue_preloader.py
      - name: Check actual B6 overlay for Thomson cancellation and old-loop suppression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          loader=Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java').read_text()
          exo=Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/controller/ExoPlayerController.java').read_text()
          assert loader.count('!isThomsonShortWindowTarget()') >= 3
          assert 'if (isThomsonShortWindowTarget() ||' in loader
          assert 'if (secondSlot && !ShortsDeviceWarmupPolicy.allowSecondSampleCandidate(' in exo
          assert 'if (!hasThomsonSampleHeadroom()) {' in exo
          assert 'if (!hasThomsonSampleHeadroom()) return;' in exo
          assert 'mEventListener.onFirstFrame(video)' in exo
          print('MT-020 overlay contracts: PASS')
          PY
      - name: Common unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :common:testStstableDebugUnitTest
      - name: Playback unit tests
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:testStstableDebugUnitTest
      - name: Build branded universal release APK
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStstableRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MT-020-MarsTube-unsigned-CI-not-for-install
          path: smarttubetv/build/outputs/apk/ststable/release/*.apk
