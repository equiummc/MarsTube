name: MT2-030 signed in-app search test APK (artifact only)
on:
  push:
    branches:
      - feature/mt2-030-inapp-search-input-20261107
    paths:
      - '.github/workflows/mt2-030-signed-artifact.yml'
      - 'mt2-player-lab/**'
      - 'tools/build-marstube-production.sh'
  workflow_dispatch:

concurrency:
  group: mt2-030-signed-artifact
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed_test:
    name: Build and archive signed APK without any release
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build official-signature 0.0.30 without touching stable channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('mt2-player-lab/production-version.json'))
          assert p['versionName']=='0.0.30'
          assert p['versionCode']==12030
          assert p['packageName']=='de.equiummc.marstube2'
          PY
          bash tools/build-marstube-production.sh
      - name: Verify signed APK and package invariants
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/MarsTube-0.0.30.apk
          grep -Fq "name='de.equiummc.marstube2'" dist/badging.txt
          grep -Fq "versionCode='12030'" dist/badging.txt
          grep -Fq 'certificate SHA-256 digest:' dist/signature.txt
      - name: Preserve verified signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarsTube-0.0.30-signed
          path: |
            dist/MarsTube-0.0.30.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
