name: MarsTube production – interne Compile-Prüfung (keine Test-App)

on:
  push:
    branches:
      - mars/production-2
    paths:
      - 'mt2-player-lab/**'
      - 'tools/build-marstube-production.sh'
      - '.github/workflows/mt2-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Release-Code bauen; APK niemals veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Rein interner Wegwerf-Signierschlüssel (nicht für Benutzer)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/compile-only.jks" \
            -alias compile-only -keyalg RSA -keysize 3072 \
            -validity 2 -storepass "$pass" -keypass "$pass" \
            -dname "CN=Internal compile check, O=MarsTube" -noprompt >/dev/null 2>&1
          printf 'MARS_SIGNING_STORE_PASS=%s\n' "$pass" >> "$GITHUB_ENV"
          printf 'MARS_SIGNING_KEY_PASS=%s\n' "$pass" >> "$GITHUB_ENV"
          printf 'MARS_SIGNING_KEY_ALIAS=compile-only\n' >> "$GITHUB_ENV"
          printf 'MARS_SIGNING_KEYSTORE_B64=%s\n' \
            "$(base64 -w0 "$RUNNER_TEMP/compile-only.jks")" >> "$GITHUB_ENV"
      - name: Produktionscode kompilieren und APK intern prüfen
        shell: bash
        run: bash tools/build-marstube-production.sh
      - name: Produktionspaket- und Signaturschema bestätigt
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MarsTube-0.0.16.apk
          test -s dist/marstube-tv.json
          (cd dist && sha256sum -c SHA256SUMS)
          echo "Produktionscode kompiliert. Keine CI-APK hochgeladen oder veröffentlicht."
