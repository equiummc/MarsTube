name: MT-019 Shorts rewind black frame recovery (Fire and Thomson)
on:
  push:
    branches:
      - fix/mt-019-shorts-blackframe-recovery-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branding-and-playback-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check safety and canonical identity
        run: |
          python3 scripts/mars/verify_fork.py --require-submodules
          grep -F 'android:icon="@drawable/mars_brand_tile"' smarttubetv/src/main/AndroidManifest.xml
          grep -F 'android:banner="@drawable/mars_brand_banner"' smarttubetv/src/main/AndroidManifest.xml
          grep -F 'name="appLogo">@drawable/mars_brand_badge' smarttubetv/src/main/res/values/styles.xml
          grep -q 'viewportWidth="1024"' smarttubetv/src/main/res/drawable/mars_brand_tile.xml
          ! grep -q 'M18,0 H102' smarttubetv/src/main/res/drawable/mars_brand_tile.xml
          grep -Fq 'section.getId() == MediaGroup.TYPE_HOME' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseFragment.java
          grep -Fq 'return R.drawable.mars_brand_mark;' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseFragment.java
          grep -Fq 'android:fillColor="#FF168DFF"' smarttubetv/src/main/res/drawable/mars_brand_mark.xml
          test -f smarttubetv/src/main/res/drawable/mars_brand_tile.xml
          test -f smarttubetv/src/main/res/drawable/mars_brand_banner.xml
          test -f smarttubetv/src/main/res/drawable/mars_brand_badge.xml
      - name: Guard MT-016 Fire TV Shorts recovery and visual treatment
        run: |
          grep -Fq 'SHORT_CONTINUATION_TIMEOUT_MS = 6_000L' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'mShortRecovery.claimTimeoutRetry()' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'mSuggestionsController.cancelShortContinuation()' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'public void cancelShortContinuation()' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/SuggestionsController.java
          grep -Fq 'setInitialDelay(video != null && video.isShorts ? 1_800L : 700L)' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackFragment.java
          grep -Fq 'return mIsMarsShortPrefetchEnabled;' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/prefs/PlayerTweaksData.java
          grep -Fq 'mIsMarsShortPrefetchEnabled = Helpers.parseBoolean(split, 63, false)' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/prefs/PlayerTweaksData.java
          test -f common/src/test/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsContinuationRecoveryPolicyTest.java
      - name: Guard MT-017 temporary OK long-hold without changing Short click or playback
        run: |
          grep -Fq 'ViewConfiguration.getLongPressTimeout()' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackActivity.java
          grep -Fq 'mPlaybackFragment.setSpeed(2.0f)' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackActivity.java
          grep -Fq 'mPlaybackFragment.setSpeed(mOkSpeed.previousSpeed())' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackActivity.java
          grep -Fq 'super.dispatchKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_DOWN, key, 0))' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackActivity.java
          grep -Fq 'resetMarsOkDoubleSpeed()' smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackFragment.java
          test -f smarttubetv/src/test/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/MarsOkHoldSpeedStateTest.java
      - name: Verify reverse Short caching and spinner cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          loader = Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java').read_text()
          fragment = Path('smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/playback/PlaybackFragment.java').read_text()
          assert 'MT-019 shorts_back_route=fresh_source' in loader
          assert 'mFreshShortPlaybackId = adjacent.videoId;' in loader
          assert 'video.videoId.equals(mFreshShortPlaybackId)' in loader
          assert 'fresh_recovery_or_rewind' in loader
          start = loader.index('private void loadFormatInfo(Video video)')
          stop = loader.index('private boolean usableFormat', start)
          body = loader[start:stop]
          assert body.index('mShortWarmCache.get(') < body.index('if (warm == null)') < body.index('Utils.post(mShowProgressBar)')
          assert 'if (warm == null)' in body
          start = fragment.index('public void showProgressBar(boolean show)')
          end = fragment.index('public void setSeekBarSegments', start)
          body = fragment[start:end]
          assert body.index('if (!show)') < body.index('mExoPlayerController.isLoading()')
          assert 'getProgressBarManager().hide();' in body
          assert 'video != null && video.isShorts ? 1_800L : 700L' in fragment
          print('MT-018 reverse Shorts cache and unconditional spinner hide regression GREEN')
          PY
      - name: MT-019 first-frame watchdog and single forced-fresh recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common')
          loader=(base/'app/models/playback/controllers/VideoLoaderController.java').read_text()
          policy=(base/'app/models/playback/controllers/ShortsFirstFrameRecoveryPolicy.java').read_text()
          exo=(base/'exoplayer/controller/ExoPlayerController.java').read_text()
          presenter=(base/'app/presenters/PlaybackPresenter.java').read_text()
          listener=(base/'app/models/playback/listener/PlayerEngineEventListener.java').read_text()
          assert 'mEventListener.onFirstFrame(video)' in exo
          assert 'process(listener -> listener.onFirstFrame(item))' in presenter
          assert 'default void onFirstFrame(Video item)' in listener
          assert 'mFirstFrameRecovery.claimFreshRetry(selected.videoId)' in loader
          assert 'scheduleFirstFrameWatchdog(ShortsFirstFrameRecoveryPolicy.RETRY_TIMEOUT_MS)' in loader
          assert 'mShortWarmCache.remove(selected.videoId)' in loader
          assert 'onFirstFrame(Video video)' in loader
          assert 'mFirstFrameRecovery.firstFrame(video.videoId)' in loader
          assert 'mFirstFrameRecovery.selected(item.isShorts ? item.videoId : null)' in loader
          assert 'retryClaimed = true' in policy
          assert 'INITIAL_TIMEOUT_MS = 8_000L' in policy
          assert 'RETRY_TIMEOUT_MS = 10_000L' in policy
          assert 'SHORT_CONTINUATION_TIMEOUT_MS = 6_000L' in loader
          assert 'isFireShortWindowTarget()' in loader
          assert 'mShortPrefetchObservable' in loader
          assert (base/'app/models/playback/controllers/ShortsFirstFrameRecoveryPolicy.java').exists()
          assert Path('common/src/test/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsFirstFrameRecoveryPolicyTest.java').exists()
          print('MT-019 first-frame recovery static contract GREEN')
          PY
      - name: Validate three-back and sequential three-ahead Fire metadata window
        run: |
          test -f common/src/test/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsWindowPolicyTest.java
          grep -Fq 'PREVIOUS_COUNT = 3' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsWindowPolicy.java
          grep -Fq 'NEXT_COUNT = 3' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsWindowPolicy.java
          grep -Fq 'REQUEST_TIMEOUT_MS = 3_500L' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/ShortsWindowPolicy.java
          grep -Fq 'mShortWarmCache.put(target.videoId, info' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'cancelShortWindow();' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'isFireShortWindowTarget()' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          grep -Fq 'return "raven".equalsIgnoreCase(android.os.Build.DEVICE)' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
          ! grep -Fq 'setMarsShortMediaPreloadEnabled(true)' common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/playback/controllers/VideoLoaderController.java
      - name: Apply the exact pinned B6 overlays (unchanged)
        run: |
          python3 scripts/mars/mt008_probe_media_core.py
          python3 scripts/mars/mt009_probe_signature_stages.py --check
          python3 scripts/mars/mt009_probe_signature_stages.py
          python3 scripts/mars/mt010a_decoder_cache.py --check
          python3 scripts/mars/mt010a_decoder_cache.py
          python3 scripts/mars/mt010a2_warm_runtime.py --check
          python3 scripts/mars/mt010a2_warm_runtime.py
          node scripts/mars/mt010a2_validate_solver.js
          python3 scripts/mars/mt011a_tcl_stage_probes.py --check
          python3 scripts/mars/mt011a_tcl_stage_probes.py
          python3 scripts/mars/mt011ab_lowcopy_tcl.py --check
          python3 scripts/mars/mt011ab_lowcopy_tcl.py
          python3 scripts/mars/mt011ab_memory_source_cache.py --check
          python3 scripts/mars/mt011ab_memory_source_cache.py
          node scripts/mars/mt011ab_verify_challenges.js
          python3 scripts/mars/mt011b3_queue_preloader.py --check
          python3 scripts/mars/mt011b3_queue_preloader.py
      - name: Execute Fire installer preflight and mocked startup metrics
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/mars/Test-MT017-FireInstaller.ps1
      - name: Validate both Fire and Thomson PowerShell installer safety
        shell: pwsh
        run: |
          $env:TEMP=$env:RUNNER_TEMP
          foreach($variant in @(
            @{File='scripts/mars/Install-MT019-Fire-BlackFrameFix.ps1';Device='192.168.41.24:5555';Wrong='192.168.41.53:5555'},
            @{File='scripts/mars/Install-MT019-Thomson-BlackFrameFix.ps1';Device='192.168.41.53:5555';Wrong='192.168.41.24:5555'}
          )){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $variant.File).Path,[ref]$tokens,[ref]$errors
            ) | Out-Null
            if($errors.Count -gt 0){$errors | Format-List | Out-Host;exit 1}
            $content=Get-Content $variant.File -Raw
            if($content.Contains($variant.Wrong)){throw "Wrong target: $($variant.File)"}
            if(-not $content.Contains($variant.Device)){throw "Missing target: $($variant.File)"}
            if($content -match '(?im)^\s*\$home\s*='){throw "Read-only HOME shadow: $($variant.File)"}
            if($content -match 'pm uninstall|pm clear|cmd package set-home-activity|settings put'){throw "Destructive command: $($variant.File)"}
            $preamble=($content -split '(?m)^try \{',2)[0]
            if($preamble -eq $content){throw "Missing main entry: $($variant.File)"}
            . ([scriptblock]::Create($preamble))
            if($codeSha -ne '761676ccb693ff136e819c40d3ec966170b43e3b'){
              throw "Incorrect verified source: $($variant.File)"
            }
            Write-Host "Safe signed installer checked: $($variant.File)"
          }
      - name: Common unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :common:testStstableDebugUnitTest
      - name: MarsTube remote-hold JVM tests
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:testStstableDebugUnitTest
      - name: Build branded debug APK
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStstableDebug
      - name: Build branded release APK
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStstableRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MT-019-MarsTube-CI-apks-not-install-signed
          path: |
            smarttubetv/build/outputs/apk/ststable/debug/*.apk
            smarttubetv/build/outputs/apk/ststable/release/*.apk
