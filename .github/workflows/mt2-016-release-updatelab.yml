name: MarsTube genuine 0.0.14 to 0.0.15 TV in-app update test

on:
  push:
    branches:
      - feature/mt2-016-real-update-test-20261105
    paths:
      - "mt2-player-lab/**"
      - ".github/workflows/mt2-016-release-updatelab.yml"
  workflow_dispatch:

concurrency:
  group: mt2-016-update-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pair:
    name: Compile verified same-package 014 and 015 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Pin NewTube with submodules
        shell: bash
        run: |
          set -euo pipefail
          mkdir newtube-reference
          git -C newtube-reference init
          git -C newtube-reference remote add origin https://github.com/aleixrodriala/newtube.git
          git -C newtube-reference fetch --depth 1 origin 6f96a1b42bb9272935360d7e5aec34d35f2753f0
          git -C newtube-reference checkout --detach FETCH_HEAD
          git -C newtube-reference submodule update --init --recursive --depth 1
          test "$(git -C newtube-reference rev-parse HEAD)" = "6f96a1b42bb9272935360d7e5aec34d35f2753f0"
      - name: Install required Android compile packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;21.0.6113669"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          sed -i "s@'../SharedModules'@'./SharedModules'@g;s@'../MediaServiceCore'@'./MediaServiceCore'@g" newtube-reference/settings.gradle
          chmod +x newtube-reference/gradlew
      - name: Prepare exact MarsTube v0.0.14 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 mt2-player-lab/patch_tv_input.py newtube-reference
          python3 mt2-player-lab/patch_sabr_recovery.py newtube-reference
          python3 mt2-player-lab/patch_lab_identity.py newtube-reference
          python3 mt2-player-lab/patch_tv_shell.py newtube-reference
          python3 mt2-player-lab/patch_005_navigation.py newtube-reference
          python3 mt2-player-lab/patch_005_localize.py newtube-reference
          python3 mt2-player-lab/patch_005_mobile_de.py newtube-reference
          python3 mt2-player-lab/patch_006_unified.py newtube-reference
          python3 mt2-player-lab/patch_006_isolated_firetv.py newtube-reference
          python3 mt2-player-lab/patch_007_tv_quality.py newtube-reference
          python3 mt2-player-lab/patch_007_translate_common.py newtube-reference
          python3 mt2-player-lab/patch_008_tv_player.py newtube-reference
          python3 mt2-player-lab/patch_009_tv_shorts_ui.py newtube-reference
          python3 mt2-player-lab/patch_010_player_settings_ui.py newtube-reference
          python3 mt2-player-lab/patch_011_firetv_navigation.py newtube-reference
          python3 mt2-player-lab/patch_012_tv_updates.py newtube-reference
          python3 mt2-player-lab/patch_013_tv_focus_ui.py newtube-reference
          python3 mt2-player-lab/patch_014_tv_shorts_mode.py newtube-reference
          test -s mt2-player-lab/legacy/MarsTvRail_014.txt
          test -s mt2-player-lab/legacy/MarsTvShell_014.txt
      - name: Build and verify exact same-signature update pair
        shell: bash
        run: bash mt2-player-lab/build_015_update_pair.sh
      - name: Validate Android permissions and published manifest contract
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          for version in 0.0.14 0.0.15; do
            if [ "$version" = "0.0.14" ]; then
              apk=dist/MarsTube-0.0.14-updatebase.apk
            else
              apk=dist/MarsTube-0.0.15-update.apk
            fi
            "$aapt" dump permissions "$apk" > "$apk.permissions"
            grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$apk.permissions"
            for denied in REQUEST_DELETE_PACKAGES SYSTEM_ALERT_WINDOW RECORD_AUDIO; do
              if grep -q "android.permission.$denied" "$apk.permissions"; then
                echo "::error::Forbidden permission $denied in $apk"
                exit 1
              fi
            done
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          tag = Path("dist/release-tag.txt").read_text().strip()
          data = json.loads(Path("dist/marstube-tv.json").read_text())
          assert set(data) == {"package", "0.0.15"}, set(data)
          assert data["0.0.15"]["versionCode"] == 12015
          url = data["package"]["downloadUrlList"]
          assert len(url) == 1
          assert url[0] == (f"https://github.com/equiummc/MarsTube/releases/download/"
                            f"{tag}/MarsTube-0.0.15-update.apk")
          assert data["package"]["downloadSize"] == Path("dist/MarsTube-0.0.15-update.apk").stat().st_size
          assert tag.startswith("mt2-015-updatelab-")
          print("Update feed contract, package, size and version valid.")
          PY
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload pair for one-time Fire TV baseline installation
        uses: actions/upload-artifact@v4
        with:
          name: marstube-014-to-015-update-test-pair
          path: dist/**
          if-no-files-found: error
          retention-days: 21
      - name: Keep test reports also when a test fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marstube-014-015-update-test-reports
          path: |
            newtube-reference/smarttubetv/build/reports/tests/**
            newtube-reference/sabr-media3/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  publish-update:
    name: Publish immutable prerelease with update APK and JSON
    needs: build-pair
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the verified test pair
        uses: actions/download-artifact@v4
        with:
          name: marstube-014-to-015-update-test-pair
          path: dist
      - name: Publish version 015 for the dedicated Fire TV in-app feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(cat dist/release-tag.txt)
          test "$tag" = "mt2-015-updatelab-${GITHUB_SHA:0:12}"
          test -s dist/MarsTube-0.0.14-updatebase.apk
          test -s dist/MarsTube-0.0.15-update.apk
          test -s dist/marstube-tv.json
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite an update feed."
            exit 1
          fi
          gh release create "$tag" \
            dist/MarsTube-0.0.15-update.apk \
            dist/marstube-tv.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MarsTube 0.0.15 – echter Update-Test vom Fire TV" \
            --notes "Test-Update 0.0.14 zu 0.0.15. Die 0.0.14-Updatebase aus dem zugehörigen CI-Artefakt einmal per ADB installieren; danach am TV Einstellungen > Auf Updates prüfen. Gleiche Paketkennung und Signatur innerhalb dieses einen Build-Paars. Der CI-Debugschlüssel ist nicht dauerhaft: keine Updates von anderen Runs installieren. Bisherige firetest014/015-Apps bleiben unberührt."
          gh release view "$tag" --json isDraft,isPrerelease,assets \
            --jq '{draft:.isDraft, prerelease:.isPrerelease, assets:[.assets[].name]}' > dist/release-verified.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/release-verified.json").read_text())
          assert d["draft"] is False and d["prerelease"] is True
          assert {"MarsTube-0.0.15-update.apk", "marstube-tv.json", "SHA256SUMS"} <= set(d["assets"])
          print("Published update feed and APK verified in GitHub release.")
          PY
