name: MT2-031 ARM32 Fire TV signed CI

on:
  push:
    branches:
      - feature/mt2-031-compact-shorts-apk-audit-20261108
    paths:
      - 'mt2-player-lab/tools/Build-MarsTube-Local031-ARM32.ps1'
      - 'tools/build-marstube-arm32-031.sh'
      - '.github/workflows/mt2-031-arm32-ci.yml'
  workflow_dispatch:

concurrency:
  group: mt2-031-arm32-release-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_arm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build signed ARM32-only MarsTube 0.0.31
        run: |
          set -euo pipefail
          bash tools/build-marstube-arm32-031.sh
      - name: Confirm all native libraries are armeabi-v7a, and signing/version are valid
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          grep -Fq "name='de.equiummc.marstube2'" dist/badging.txt
          grep -Fq "versionCode='12031'" dist/badging.txt
          grep -Fq "versionName='0.0.31'" dist/badging.txt
          grep -Fq 'certificate SHA-256 digest:' dist/signature.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path("dist/MarsTube-0.0.31-ARM32.apk")
          with zipfile.ZipFile(apk) as z:
              libs=[e for e in z.infolist() if e.filename.startswith("lib/") and e.filename.endswith(".so")]
              abis=sorted({e.filename.split("/")[1] for e in libs})
              assert abis==["armeabi-v7a"], f"Unexpected native library ABIs {abis}"
              print("PASS ARM32-only native library ABI:",abis)
              print("Signed APK total MB:",round(apk.stat().st_size/1e6,2))
              print("Native libraries MB:",round(sum(e.compress_size for e in libs)/1e6,2))
          PY
      - name: Archive verified ARM32 variant (not an automatic release)
        uses: actions/upload-artifact@v4
        with:
          name: MarsTube-0.0.31-ARM32-ci-only
          path: |
            dist/MarsTube-0.0.31-ARM32.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
