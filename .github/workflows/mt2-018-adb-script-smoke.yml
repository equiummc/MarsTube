name: Verify MarsTube ADB diagnosis PowerShell 7

on:
  push:
    branches:
      - feature/mt2-018-adb-lastExitCode-fix-20261106
    paths:
      - 'tools/Diagnose-MarsTube-Update.ps1'
      - '.github/workflows/mt2-018-adb-script-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: PowerShell 7 parser and mocked Android device
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse and run actual script against simulated ADB device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mock-adb"
          cat > "$RUNNER_TEMP/mock-adb/adb.exe" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$1" = version ]; then
            printf '%s\n' 'Android Debug Bridge version 1.0.41' 'Version 37.0.1-15733141'
          elif [ "$1" = devices ]; then
            printf '%s\n' 'List of devices attached' "$(printf '192.0.2.42:5555\tdevice')"
          elif [ "$1" = -s ]; then
            if [ "$2" != '192.0.2.42:5555' ]; then exit 15; fi
            if [ "$3" = shell ]; then
              printf '%s\n' 'Packages:' '  versionCode=12016 minSdk=23 targetSdk=37' '  versionName=0.0.16'
            elif [ "$3" = logcat ] && [ "$4" = -c ]; then
              exit 0
            elif [ "$3" = logcat ] && [ "$4" = -d ]; then
              printf '%s\n' '11-06 19:30:00.001 D/AppUpdates: checking version 12016' '11-06 19:30:00.123 D/AppVersionChecker: available 12017'
            else
              exit 14
            fi
          else
            exit 13
          fi
          SH
          chmod +x "$RUNNER_TEMP/mock-adb/adb.exe"
          pwsh -NoProfile -Command '$t=$null; $e=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/Diagnose-MarsTube-Update.ps1",[ref]$t,[ref]$e)|Out-Null; if($e.Count -gt 0){throw ($e|Out-String)}; Write-Host "PASS: PowerShell 7 syntax"'
          printf '\n' | pwsh -NoProfile -File tools/Diagnose-MarsTube-Update.ps1 -AdbPath "$RUNNER_TEMP/mock-adb/adb.exe"
          test -s tools/MarsTube-Update-Diagnose.txt
          grep -Fq "versionCode=12016" tools/MarsTube-Update-Diagnose.txt
          grep -Fq "AppVersionChecker: available 12017" tools/MarsTube-Update-Diagnose.txt
          echo 'PASS: PowerShell 7 runtime with simulated Android TV, ADB discovery and update log capture'
