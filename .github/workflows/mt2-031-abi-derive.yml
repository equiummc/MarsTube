name: MT2-031 signed ABI variants from verified universal

on:
  push:
    branches: [feature/mt2-031-compact-shorts-apk-audit-20261108]
    paths:
      - 'tools/derive-marstube-abi-from-signed-031.sh'
      - '.github/workflows/mt2-031-abi-derive.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mt2-031-signed-abi-derivation
  cancel-in-progress: true

jobs:
  signed_variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build-tools for safe zipalign and signature verification
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" 'build-tools;37.0.0' > /dev/null || test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/zipalign"
      - name: Retrieve trusted previously validated 0.0.31 universal APK
        uses: actions/download-artifact@v4
        with:
          name: MarsTube-0.0.31-ci-only
          run-id: 42425813294
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: source-031
      - name: Create signed ARM32 and ARM64 without rebuilding or changing UI
        run: |
          set -euo pipefail
          bash tools/derive-marstube-abi-from-signed-031.sh source-031/MarsTube-0.0.31.apk verified-abi
          (cd verified-abi && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          a=Path('source-031/MarsTube-0.0.31.apk')
          for label,wanted in [('ARM32','armeabi-v7a'),('ARM64','arm64-v8a')]:
              p=Path('verified-abi')/f'MarsTube-0.0.31-{label}.apk'
              with zipfile.ZipFile(p) as z:
                  native={n.filename.split('/')[1] for n in z.infolist() if n.filename.startswith('lib/') and n.filename.endswith('.so')}
                  assert native=={wanted},(label,native)
              assert p.stat().st_size < a.stat().st_size
              print(label,'MB',round(p.stat().st_size/1e6,2),'saved MB',round((a.stat().st_size-p.stat().st_size)/1e6,2))
          PY
      - name: Archive validated ABI test APKs
        uses: actions/upload-artifact@v4
        with:
          name: MarsTube-0.0.31-ARM32-ARM64-verified
          path: |
            verified-abi/MarsTube-0.0.31-ARM32.apk
            verified-abi/MarsTube-0.0.31-ARM64.apk
            verified-abi/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
