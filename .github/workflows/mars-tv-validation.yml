name: MT-001 MarsTube TV validation
on:
  pull_request:
    branches:
      - mars/stable
      - fix/mars-glass-inapp-no-logo-32-68-11
  push:
    branches:
      - feature/mt-001-upstream-ci-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mars-tv-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout including real Git submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify submodule checkout
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          for file in SharedModules/core_settings.gradle MediaServiceCore/core_settings.gradle exoplayer-amzn-2.10.6/core_settings.gradle; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done

      - name: Protect MarsTube TV customizations
        run: python3 scripts/mars/verify_fork.py --require-submodules

      - name: Build native Android TV debug APK (not for release)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStstableDebug

      - name: Run applicable common module unit tests
        run: ./gradlew --no-daemon --stacktrace :common:testStstableDebugUnitTest

      - name: Upload test APK (not a published release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marstube-mt001-android-tv-debug
          path: smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
          retention-days: 7
