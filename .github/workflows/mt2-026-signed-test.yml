name: MT2-026 einmaliges signiertes Test-APK (kein Release)
on:
  push:
    branches:
      - feature/mt2-026-shorts-actions-comments-20261107
    paths:
      - '.github/workflows/mt2-026-signed-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Signiertes APK v0.0.26 für lokale Fire-TV-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MARS_SIGNING_KEYSTORE_B64: ${{ secrets.MARS_SIGNING_KEYSTORE_B64 }}
      MARS_SIGNING_STORE_PASS: ${{ secrets.MARS_SIGNING_STORE_PASS }}
      MARS_SIGNING_KEY_PASS: ${{ secrets.MARS_SIGNING_KEY_PASS }}
      MARS_SIGNING_KEY_ALIAS: ${{ secrets.MARS_SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build and sign exactly the audited MT2-026 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" != ""
          python3 - <<'PY'
          import json
          data=json.load(open('mt2-player-lab/production-version.json'))
          assert data['versionName']=='0.0.26' and data['versionCode']==12026
          assert data['packageName']=='de.equiummc.marstube2'
          PY
          bash tools/build-marstube-production.sh
      - name: Verify SHA, version, package and certificate
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/MarsTube-0.0.26.apk
          grep -Fq "name='de.equiummc.marstube2'" dist/badging.txt
          grep -Fq "versionCode='12026'" dist/badging.txt
          grep -Fq 'certificate SHA-256 digest:' dist/signature.txt
          echo 'PASS: 0.0.26 is signed with the existing GitHub release keystore'
      - uses: actions/upload-artifact@v4
        with:
          name: MarsTube-0.0.26-signed-test
          path: |
            dist/MarsTube-0.0.26.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
