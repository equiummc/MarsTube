name: MarsTube Update E2E Testreihe (NewTube-Vergleich, keine Veröffentlichung)

on:
  push:
    branches:
      - diagnostics/mt2-022-update-regression-20261107
    paths:
      - 'mt2-player-lab/MarsTubeUpdateRegressionTest.java'
      - '.github/workflows/mt2-update-investigation-ci.yml'
      - 'tools/Test-MarsTube-Update.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt2-update-investigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live_http:
    name: HTTP-Redirects, Alt/Neu-Feeds und Cache-Bust live
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read real public GitHub update URLs with NewTube-compatible headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt2-feed
          for kind in mars_normal mars_nonce mars_pinned newtube_normal newtube_legacy newtube_pinned; do
            case "$kind" in
              mars_normal) url="https://github.com/equiummc/MarsTube/releases/latest/download/marstube-tv.json";;
              mars_nonce) url="https://github.com/equiummc/MarsTube/releases/latest/download/marstube-tv.json?mars_check=$(date +%s%N)";;
              mars_pinned) url="https://github.com/equiummc/MarsTube/releases/download/v0.0.21/marstube-tv.json";;
              newtube_normal) url="https://github.com/aleixrodriala/newtube/releases/latest/download/newtube.json";;
              newtube_legacy) url="https://github.com/aleixrodriala/newtube/releases/download/latest/newtube.json";;
              newtube_pinned) url="https://github.com/aleixrodriala/newtube/releases/download/v1.17.1/newtube.json";;
            esac
            echo "::group::$kind"
            curl --fail --silent --show-error --location --max-time 45 --retry 3 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.114 Safari/537.36' \
              -H 'Accept: */*' \
              -o "/tmp/mt2-feed/$kind.json" \
              -w 'HTTP=%{http_code}, redirects=%{num_redirects}, bytes=%{size_download}, content-type=%{content_type}\n' "$url"
            python3 - "$kind" <<'PY'
          import json, sys
          from pathlib import Path
          kind = sys.argv[1]
          v = json.loads((Path('/tmp/mt2-feed')/(kind+'.json')).read_text(encoding='utf-8'))
          latest = sorted(((x['versionCode'],name) for name,x in v.items() if name!='package'), reverse=True)
          print('parsed_latest=',latest[:1], 'downloads=',len(v['package'].get('downloadUrlList',[])))
          assert latest and v['package'].get('downloadUrlList')
          PY
            echo "::endgroup::"
          done
      - name: 0.0.20 MUST see 0.0.21, normal and nonce GET are identical
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/mt2-feed')
          j=lambda name:json.loads((p/(name+'.json')).read_text())
          mars=[j(k) for k in ('mars_normal','mars_nonce','mars_pinned')]
          assert all(v==mars[0] for v in mars), 'Latest, nonce and pinned feeds disagree'
          for m in mars:
              assert m['0.0.21']['versionCode']==12021, 'Expected 0.0.21/12021 not found'
              assert any(d.endswith('MarsTube-0.0.21.apk') for d in m['package']['downloadUrlList'])
          newtube=[j(k) for k in ('newtube_normal','newtube_legacy','newtube_pinned')]
          assert all(v['1.17.1']['versionCode']==11701 for v in newtube), 'NewTube feeds diverged'
          print('PASS: Both normal and nonce request deliver 12021; NewTube primary/legacy deliver 11701.')
          PY

  java_parser:
    name: Actual NewTube Java parser and MarsTube 12020->12021 unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Fetch immutable NewTube 1.17.1 source/submodules
        shell: bash
        run: |
          set -euo pipefail
          mkdir newtube-reference
          git -C newtube-reference init
          git -C newtube-reference remote add origin https://github.com/aleixrodriala/newtube.git
          git -C newtube-reference fetch --depth 1 origin 6f96a1b42bb9272935360d7e5aec34d35f2753f0
          git -C newtube-reference checkout --detach FETCH_HEAD
          git -C newtube-reference submodule update --init --recursive --depth 1
          test "$(git -C newtube-reference rev-parse HEAD)" = '6f96a1b42bb9272935360d7e5aec34d35f2753f0'
      - name: Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;21.0.6113669'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"; fi
          sed -i "s@'../SharedModules'@'./SharedModules'@g;s@'../MediaServiceCore'@'./MediaServiceCore'@g" newtube-reference/settings.gradle
      - name: Apply production overlays identically to v0.0.21, test-only
        run: |
          set -euo pipefail
          for patch in \
            patch_tv_input.py patch_sabr_recovery.py patch_lab_identity.py \
            patch_tv_shell.py patch_005_navigation.py patch_005_localize.py \
            patch_005_mobile_de.py patch_006_unified.py patch_006_isolated_firetv.py \
            patch_007_tv_quality.py patch_007_translate_common.py patch_008_tv_player.py \
            patch_009_tv_shorts_ui.py patch_010_player_settings_ui.py \
            patch_011_firetv_navigation.py patch_012_tv_updates.py \
            patch_013_tv_focus_ui.py patch_014_tv_shorts_mode.py \
            patch_015_universal_back.py patch_016_production.py \
            patch_017_shorts_stage.py patch_018_tv_ux.py \
            patch_019_shorts_three_column.py patch_020_update_freshness.py \
            patch_021_shorts_home_pause.py; do
            python3 "mt2-player-lab/$patch" newtube-reference
          done
          grep -Fq 'versionCode 12021' newtube-reference/smarttubetv/build.gradle
          grep -Fq 'mars_check' newtube-reference/SharedModules/appupdatechecker2/src/main/java/com/liskovsoft/appupdatechecker2/core/AppVersionChecker.java
          grep -Fq 'mManualRecheckAfterAuto' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/update/AppUpdates.java
          grep -Fq 'MobileUpdateActivity' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/playback/MarsTvShell.java || true
      - name: Fetch ACTUAL published immutable MarsTube and NewTube update manifests
        run: |
          set -euo pipefail
          dst=newtube-reference/SharedModules/appupdatechecker2/src/test
          mkdir -p "$dst/resources"
          cp mt2-player-lab/MarsTubeUpdateRegressionTest.java "$dst/java/com/liskovsoft/appupdatechecker2/core/"
          curl -fsSL --retry 3 --max-time 45 \
            'https://github.com/equiummc/MarsTube/releases/download/v0.0.21/marstube-tv.json' \
            -o "$dst/resources/marstube-v0.0.21.json"
          curl -fsSL --retry 3 --max-time 45 \
            'https://github.com/aleixrodriala/newtube/releases/download/v1.17.1/newtube.json' \
            -o "$dst/resources/newtube-v1.17.1.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('newtube-reference/SharedModules/appupdatechecker2/src/test/resources')
          assert json.loads((d/'marstube-v0.0.21.json').read_text())['0.0.21']['versionCode']==12021
          assert json.loads((d/'newtube-v1.17.1.json').read_text())['1.17.1']['versionCode']==11701
          PY
      - name: Run original NewTube parser tests and additional real MarsTube regression tests
        run: |
          chmod +x newtube-reference/gradlew
          (cd newtube-reference && ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4096m \
            :appupdatechecker2:testDebugUnitTest :smarttubetv:testStmobileDebugUnitTest --stacktrace)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mt2-update-java-test-reports
          path: |
            newtube-reference/SharedModules/appupdatechecker2/build/reports/tests/**
            newtube-reference/smarttubetv/build/reports/tests/**
          if-no-files-found: ignore

  powershell_syntax:
    name: PowerShell 7 diagnostics script parses safely
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse, never execute, the Windows diagnostic script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            'tools/Test-MarsTube-Update.ps1', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          $content = Get-Content -Raw 'tools/Test-MarsTube-Update.ps1'
          if ($content -match 'adb\s+.*(install|uninstall|logcat\s+-c|pm\s+clear)') {
            throw 'Diagnostics script may not install, uninstall or clear app data/logs.'
          }
          Write-Host 'PASS: PS7 syntax valid, no device modifications in the diagnostic script.'

  apk_identity:
    name: Same package, increasing code and identical signature 0.0.20->0.0.21
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Get Android APK inspection tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Fetch signed official APKs and verify checksum, identity and signing continuity
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/mt2-apk
          for v in 0.0.20 0.0.21; do
            curl -fsSL --retry 3 --max-time 180 \
              "https://github.com/equiummc/MarsTube/releases/download/v$v/MarsTube-$v.apk" \
              -o "/tmp/mt2-apk/MarsTube-$v.apk"
            curl -fsSL --retry 3 --max-time 45 \
              "https://github.com/equiummc/MarsTube/releases/download/v$v/SHA256SUMS" \
              -o "/tmp/mt2-apk/SHA256SUMS-$v"
            (cd /tmp/mt2-apk && sha256sum -c "SHA256SUMS-$v")
            "$tools/aapt" dump badging "/tmp/mt2-apk/MarsTube-$v.apk" | head -1 | tee "/tmp/mt2-apk/identity-$v"
            "$tools/apksigner" verify --print-certs "/tmp/mt2-apk/MarsTube-$v.apk" \
              | grep 'Signer #1 certificate SHA-256 digest:' | tee "/tmp/mt2-apk/cert-$v"
          done
          grep -Fq "name='de.equiummc.marstube2' versionCode='12020' versionName='0.0.20'" /tmp/mt2-apk/identity-0.0.20
          grep -Fq "name='de.equiummc.marstube2' versionCode='12021' versionName='0.0.21'" /tmp/mt2-apk/identity-0.0.21
          cmp /tmp/mt2-apk/cert-0.0.20 /tmp/mt2-apk/cert-0.0.21
          echo 'PASS: 0.0.20 -> 0.0.21: same app, incremented version code, same signing certificate, SHA256 valid.'
