name: MarsTube 0.0.7 TV UI and quality Media3 test

on:
  push:
    branches:
      - experiment/mt2-media3-sabr-proof-20261102
      - feature/mt2-005-native-tv-ui-20261103
      - feature/mt2-006-unified-phone-tv-20261104
      - feature/mt2-006-isolated-firetv-20261104
      - feature/mt2-007-tv-ui-quality-20261104
    paths:
      - "mt2-player-lab/**"
      - ".github/workflows/mt2-media3-sabr-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newtube-media3-sabr-reference:
    name: Build MarsTube v0.0.7 TV UI/quality APK and test Media3
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout MarsTube experiment (read-only baseline)
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (no obsolete 'tools' package)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Pin independent NewTube reference (includes submodules)
        shell: bash
        run: |
          set -euo pipefail
          mkdir newtube-reference
          git -C newtube-reference init
          git -C newtube-reference remote add origin https://github.com/aleixrodriala/newtube.git
          git -C newtube-reference fetch --depth 1 origin 6f96a1b42bb9272935360d7e5aec34d35f2753f0
          git -C newtube-reference checkout --detach FETCH_HEAD
          git -C newtube-reference submodule update --init --recursive --depth 1
          test -f newtube-reference/sabr-media3/src/main/java/com/newtube/sabr/SabrMediaSource.java
          test -f newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/player/Media3PlayerController.java
          test "$(git -C newtube-reference rev-parse HEAD)" = "6f96a1b42bb9272935360d7e5aec34d35f2753f0"

      - name: Android API 37.0 and licenses (actual SDK package ID)
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;21.0.6113669"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # AGP compileSdk=37 still searches android-37 (without .0) on some installations.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          # Use pinned reference modules, never the unloaded parent MarsTube gitlinks.
          sed -i "s@'../SharedModules'@'./SharedModules'@g;s@'../MediaServiceCore'@'./MediaServiceCore'@g" newtube-reference/settings.gradle

      - name: Apply MT2-002 TV remote overlay to isolated NewTube checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 mt2-player-lab/patch_tv_input.py newtube-reference
          python3 mt2-player-lab/patch_sabr_recovery.py newtube-reference
          python3 mt2-player-lab/patch_lab_identity.py newtube-reference
          python3 mt2-player-lab/patch_tv_shell.py newtube-reference
          python3 mt2-player-lab/patch_005_navigation.py newtube-reference
          python3 mt2-player-lab/patch_005_localize.py newtube-reference
          python3 mt2-player-lab/patch_005_mobile_de.py newtube-reference
          python3 mt2-player-lab/patch_006_unified.py newtube-reference
          python3 mt2-player-lab/patch_006_isolated_firetv.py newtube-reference
          python3 mt2-player-lab/patch_007_tv_quality.py newtube-reference
          python3 mt2-player-lab/patch_007_translate_common.py newtube-reference
          grep -q 'mt2-003 sabr-error -> dash-once' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/player/Media3PlayerController.java
          grep -q 'marsTvPlaybackKey' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/playback/MobilePlaybackActivity.java
          grep -q 'marsTvBrowseKey' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/browse/MobileBrowseActivity.java
          grep -q 'android:label="MarsTube TV-Test 007"' newtube-reference/smarttubetv/src/stmobile/AndroidManifest.xml
          grep -q 'applicationId "de.equiummc.marstube2.firetest007"' newtube-reference/smarttubetv/build.gradle
          grep -q 'versionName "0.0.7"' newtube-reference/smarttubetv/build.gradle
          test $(grep -c '<string name=' newtube-reference/smarttubetv/src/stmobile/res/values-de/strings_settings.xml) -eq 251
          test $(grep -c '<string name=' newtube-reference/smarttubetv/src/stmobile/res/values-de/strings_settings_search.xml) -eq 35
          test $(grep -c '<string name=' newtube-reference/smarttubetv/src/stmobile/res/values-de/strings_mobile.xml) -eq 370
          test -s newtube-reference/smarttubetv/src/stmobile/res/drawable-nodpi/mars_m_logo.png
          grep -q "MarsDeviceMode.isTelevision(this)" newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/playback/MobilePlaybackActivity.java
          grep -q "getPreferredLanguage().isEmpty()" newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/MobileMainApplication.java
          grep -q "github.com/equiummc/mars-smarttube" newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/settings/SettingsPages.java
          grep -q "enable = false // single sideloadable universal APK" newtube-reference/smarttubetv/build.gradle
          grep -q 'mMarsTvShell.handle(event)' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/playback/MobilePlaybackActivity.java
          test -s newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/common/MarsTvRail.java
          grep -q 'MarsTvRail.install(this)' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/common/MobileActivity.java
          grep -q 'MAX_RECENT_SEED_BPS = 10_000_000' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/player/StartupBandwidthMeter.java
          grep -q 'int autoHeight = com.newtube.mobile.ui.common.MarsDeviceMode.isTelevision' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/player/Media3PlayerInitializer.java
          grep -q 'Detaillierte TV-Bildqualität' newtube-reference/smarttubetv/src/stmobile/java/com/newtube/mobile/ui/settings/PlayerPages.java
          test $(grep -c '<string name=' newtube-reference/common/src/main/res/values-de/mars_strings_extra.xml) -eq 45

      - name: Verify SABR tests and compile MarsTube 0.0.6 multi-device APK
        shell: bash
        working-directory: newtube-reference
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4096m :sabr-media3:testDebugUnitTest :smarttubetv:assembleStmobileDebug --stacktrace

      - name: Block risky permissions in packaged smartphone/TV APK
        shell: bash
        working-directory: newtube-reference
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$aapt"
          apk=$(find smarttubetv/build/outputs/apk -type f -name '*.apk' -path '*stmobile*' | head -n 1)
          test -s "$apk"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/mt2-permissions.txt"
          cat "$RUNNER_TEMP/mt2-permissions.txt"
          for forbidden in REQUEST_INSTALL_PACKAGES REQUEST_DELETE_PACKAGES SYSTEM_ALERT_WINDOW ACTION_MANAGE_OVERLAY_PERMISSION RECORD_AUDIO; do
            if grep -q "android.permission.$forbidden" "$RUNNER_TEMP/mt2-permissions.txt"; then
              echo "::error::Unexpected permission in APK: $forbidden"
              exit 1
            fi
          done
          "$aapt" dump badging "$apk" | grep -m 1 "^package:"
          "$aapt" dump badging "$apk" | grep -Fq "package: name='de.equiummc.marstube2.firetest007.debug'"
          echo "Security and isolated package gate passed."

      - name: Record source and APK checksums
        shell: bash
        if: success()
        run: |
          set -euo pipefail
          mkdir -p mt2-proof
          {
            echo "MarsTube 0.0.7 / de.equiummc.marstube2.firetest007.debug / TV UI and video quality preview APK"
            echo "NewTube: $(git -C newtube-reference rev-parse HEAD)"
            echo "Build: $GITHUB_RUN_ID"
            echo "MT2 TV Input patch: $(sha256sum mt2-player-lab/patch_tv_input.py)"
            echo "MT2 SABR rescue patch: $(sha256sum mt2-player-lab/patch_sabr_recovery.py)"
            echo "MT2 parallel package patch: $(sha256sum mt2-player-lab/patch_lab_identity.py)"
            find newtube-reference/smarttubetv/build/outputs/apk -name '*.apk' -path '*stmobile*' -print -exec sha256sum {} \;
          } > mt2-proof/build-manifest.txt

      - name: Upload separate Android test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marstube-v0.0.7-firetv-ui-quality-debug
          path: |
            newtube-reference/smarttubetv/build/outputs/apk/**/debug/*.apk
            mt2-proof/build-manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve test reports even if build fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marstube-v0.0.7-firetv-sabr-unit-test-reports
          path: newtube-reference/sabr-media3/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
